<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="52%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="16" y1="10" x2="84" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="docGrad" x1="28" y1="22" x2="88" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="74" y1="70" x2="114" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="cardShadow" x="14" y="14" width="90" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
    <filter id="badgeShadow" x="62" y="62" width="60" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />
  <rect x="7.5" y="7.5" width="113" height="113" rx="26.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />

  <!-- Subtle CAD Isometric Grid Lines in Background -->
  <path d="M18 38L64 16L110 38M18 90L64 112L110 90M64 16V112" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round" />

  <!-- Top Gloss Highlight -->
  <path d="M34 6H94C109.464 6 122 18.536 122 34V48C98 62 56 64 6 44V34C6 18.536 18.536 6 34 6Z" fill="url(#shineGrad)" />

  <!-- Estimate Document Sheet -->
  <g filter="url(#cardShadow)">
    <rect x="26" y="22" width="62" height="78" rx="11" fill="url(#docGrad)" />
    <!-- Top Accent Bar (Steel Frame Blue) -->
    <path d="M26 33C26 26.9249 30.9249 22 37 22H77C83.0751 22 88 26.9249 88 33V36H26V33Z" fill="#1D4ED8" />
    <circle cx="35" cy="29" r="2.2" fill="#93C5FD" />
    <circle cx="43" cy="29" r="2.2" fill="#93C5FD" />
    <circle cx="51" cy="29" r="2.2" fill="#93C5FD" />

    <!-- 3D CAD / Steel I-Beam Mini Motif + Yen Symbol -->
    <rect x="35" y="44" width="20" height="14" rx="4" fill="#DBEAFE" />
    <path d="M41.5 47.5L45 51.5L48.5 47.5M41.5 51.5H48.5M41.5 54H48.5M45 51.5V56" stroke="#1D4ED8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Estimate Table Lines -->
    <rect x="59" y="46" width="20" height="4" rx="2" fill="#3B82F6" />
    <rect x="59" y="53" width="14" height="3.5" rx="1.75" fill="#94A3B8" />

    <rect x="35" y="65" width="44" height="4" rx="2" fill="#CBD5E1" />
    <rect x="35" y="74" width="36" height="4" rx="2" fill="#CBD5E1" />
    <rect x="35" y="83" width="26" height="5" rx="2.5" fill="#2563EB" />
  </g>

  <!-- "2" Badge (ショキミツ2) -->
  <g filter="url(#badgeShadow)">
    <circle cx="92" cy="90" r="22" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="3.5" />
    <path d="M84.5 84.2C84.5 79.8 88 77 92.4 77C96.9 77 100.1 79.7 100.1 83.6C100.1 86.3 98.7 88.4 95.3 91.2L89.8 95.7H100.4V100H83.8V96.2L91.8 89.4C94.1 87.4 95 85.9 95 84.1C95 82.2 93.8 81 92.1 81C90.2 81 89 82.3 88.9 84.5L84.5 84.2Z" fill="#FFFFFF" />
  </g>
</svg>
